<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salida del Cráter</title>
<style>
:root{--bg:#1a0a14;--ink:#ffd9a8;--acc:#ff7a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:none;overscroll-behavior:none;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;height:100%;aspect-ratio:480/720;max-width:100%}
canvas{touch-action:none;width:100%;height:100%;display:block;background:#2a0f1e;image-rendering:pixelated}
#touch{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:space-between;padding:0 10px;pointer-events:none}
#touch button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #ff7a3d99;background:#2a0f1ecc;color:var(--ink);font-size:26px;touch-action:none}
#touch .mid{width:84px;height:84px;background:#ff7a3d55}
#touch div{display:flex;gap:10px;align-items:flex-end}
#shop{position:absolute;top:8px;right:8px;width:200px;background:#1a0a14ee;border:1px solid #ff7a3d88;padding:8px;display:none;font-size:12px}
#shop b{display:block;margin-bottom:4px}
#shop button{display:block;width:100%;margin:4px 0;padding:6px;background:#3a1520;color:#ffd9a8;border:1px solid #ff7a3d66;text-align:left;font:inherit;cursor:pointer}
#shop button:disabled{opacity:.45;cursor:default}
#joy{width:120px;height:120px;border-radius:50%;border:2px solid #ff7a3d99;background:#2a0f1ecc;pointer-events:auto;touch-action:none;position:relative}
#joy:before{content:'◀   ▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffd9a8aa;font-size:18px;letter-spacing:6px}
#joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ff7a3d88}
#pause{position:absolute;top:8px;left:186px;width:36px;height:36px;border-radius:8px;border:1px solid #ff7a3d88;background:#1a0a14cc;color:#ffd9a8;font-size:16px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="480" height="720"></canvas>
<button id="pause" onclick="togglePause()">⏸</button><div id="shop"></div><div id="touch"><div id="joy"><i></i></div><div><button data-k="fire">●</button><button data-k="up" class="mid">▲</button></div></div>
</div>

const LC=n=>({nm:n,rim:90+22*n,col:n>=2,saw:n>=3?.25+.04*n:0,las:n>=6?.15+.03*n:0,tur:n>=8?.12+.03*(n-8):0,dro:n>=10?.12:0,wind:n>=9,cave:n>=5&&n<=7,moon:n>=8,name:NAMES[n]});

cave:{sky:['#0a0508','#140a10','#1d0e14'],lay:['#120709','#2a1218','#4a2a22'],edge:'#7a4a3a',gr:'#2a1216',gs:'#4a2a22'},
moon:{sky:['#000000','#05060e','#10131f'],lay:['#26272d','#44464f','#80828c'],edge:'#d8dae2',gr:'#8e909a',gs:'#c8cad2'}};
const theme=()=>C.moon?TM.moon:C.cave?TM.cave:TM.mars;
const hw=m=>{const b=160+35*Math.sin(m*.11+HS)+15*Math.sin(m*.37+1+HS*2);const t=Math.min(1,Math.max(0,(m-(RIM-14))/14));return b+t*t*(3-2*t)*(330-b)};
const dockRect=d=>{const e=hw(d.m);return d.side<0?[CX-e,CX-e+110]:[CX+e-110,CX+e]};
const kmap={ArrowUp:'up',KeyW:'up',Space:'fire',KeyJ:'fire',KeyZ:'fire',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};

const joy=document.getElementById('joy'),jk=joy.firstElementChild;
function joyMove(e){const r=joy.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width/2);K.l=dx<-.25;K.r=dx>.25;jk.style.left=(40+Math.max(-1,Math.min(1,dx))*35)+'px'}

function act(){if(s.state==='crashed'||s.state==='won'||s.state==='levelup')reset();else if(s.state==='menu')s.state='play';else if(s.state==='paused')togglePause()}
function togglePause(){if(s.state==='play')s.state='paused';else if(s.state==='paused')s.state='play'}

let s,w,money=0,first=true,best={alt:0,time:0};const U={motor:0,tank:0,shield:0,gun:0,mag:0,eco:0,dmg:0,lamp:0};
const ITEMS=[['motor','Motor (+velocidad)',60],['tank','Tanque (+combustible)',50],['shield','Escudo (+1 golpe)',80],['gun','Cañón (+cadencia)',50],['mag','Imán (+20% $)',70],['eco','Ahorro (-10% gasto)',60],['dmg','Cañón pesado (+daño)',90],['lamp','Linterna (cueva)',120]];
const MX=k=>k==='lamp'?3:5;
const SAVE='crater_v3',sale=()=>/Puerto [36]/.test(s.landed||'');
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE)||'{}');if(d.U)Object.assign(U,d.U);if(d.lvl)lvl=d.lvl;money=d.money||0;if(d.best)best=d.best}catch(e){}}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({U,money,best,lvl}))}catch(e){}}
const shopEl=document.getElementById('shop');let shopOn=false;
const cost=i=>Math.round(ITEMS[i][2]*Math.pow(1.6,U[ITEMS[i][0]])*(sale()?.8:1));
function applyUp(){TH=200+30*U.motor;MAXF=100+25*U.tank;AX=260+30*U.motor;CD=Math.max(.08,.28-.04*U.gun)}
function renderShop(){let h='<b>TIENDA · $'+money+(sale()?' · OFERTA -20%':'')+'</b>';ITEMS.forEach((it,i)=>{if(it[0]==='lamp'&&lvl<5)return;const L=U[it[0]],mx=L>=MX(it[0]);h+='<button onclick="buy('+i+')" '+((mx||money<cost(i))?'disabled':'')+'>'+(i+1)+'. '+it[1]+'<br>Nv '+L+'/'+MX(it[0])+' · '+(mx?'MAX':'$'+cost(i))+'</button>'});shopEl.innerHTML=h}
function shopSync(){const on=!!s.landed&&s.state==='play';if(on!==shopOn){shopOn=on;shopEl.style.display=on?'block':'none'}}
function buy(i){const k=ITEMS[i][0],c=cost(i);if(U[k]>=MX(k)||money<c||(k==='lamp'&&lvl<5)){SND.no();return}money-=c;U[k]++;applyUp();if(k==='shield')s.shield=U.shield;if(k==='tank')s.fuel=Math.min(MAXF,s.fuel+25);SND.buy();save();renderShop()}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
// ---- sonido (sintetizado con WebAudio) ----
let AC,NB,eng,egain,muted=false,nm=0,mi=0;
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
eng=AC.createOscillator();eng.type='sawtooth';eng.frequency.value=48;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=260;egain=AC.createGain();egain.gain.value=0;eng.connect(f);f.connect(egain);egain.connect(AC.destination);eng.start()}catch(e){AC=null}}
function tone(f,d,type='square',v=.12,f2){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v=.3,fq=1200){if(!AC||muted)return;const n=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter(),t=AC.currentTime;n.buffer=NB;f.type='lowpass';f.frequency.setValueAtTime(fq,t);f.frequency.exponentialRampToValueAtTime(80,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);n.connect(f);f.connect(g);g.connect(AC.destination);n.start(t);n.stop(t+d)}
const SND={shoot:()=>tone(880,.12,'square',.07,220),box:()=>{noise(.25,.35,2500);tone(660,.08,'triangle',.1)},coin:()=>{tone(988,.08,'square',.06);setTimeout(()=>tone(1319,.15,'square',.06),70)},crash:()=>{noise(.9,.6,900);tone(120,.6,'sawtooth',.2,30)},hit:()=>{noise(.3,.4,3000);tone(200,.2,'sawtooth',.15,60)},land:()=>tone(90,.18,'sine',.3,40),buy:()=>{tone(523,.09,'triangle',.12);setTimeout(()=>tone(784,.14,'triangle',.12),90)},no:()=>tone(150,.15,'square',.08),laser:()=>tone(1500,.1,'sawtooth',.04,600),win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.14),i*140))};
function engSnd(){if(!AC)return;const t=AC.currentTime,on=s.state==='play'&&!muted;egain.gain.setTargetAtTime(on?s.th*.14:0,t,.05);eng.frequency.setTargetAtTime(45+s.th*45,t,.1);if(!muted&&s.state!=='crashed'&&t>nm){nm=t+.6;tone([220,262,330,262,196,262,311,262][mi++%8],.55,'triangle',.035)}}
function gen(){const Q=Math.random,free=m=>docks.every(d=>Math.abs(d.m-m)>9);w={boxes:[],saws:[],lasers:[],turrets:[],drones:[]};

  const wd=wind();if(Math.abs(wd)>15){ctx.strokeStyle='#ffd9a855';ctx.lineWidth=1;for(let i=0;i<14;i++){const x=((i*97+s.t*wd*4)%W+W)%W,y=(i*131+s.t*15)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+wd*.6,y);ctx.stroke()}}
  ctx.fillStyle='#ffe38a';for(const b of s.bul)ctx.fillRect(b.x-1.5,sy(b.y)-6,3,12);
  if(s.state==='play'&&(s.shield>0||s.inv>0)){ctx.strokeStyle=s.inv>0?'#fff':'#6ad0ff66';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,sy(s.y),HH+4,0,6.3);ctx.stroke()}
}
const dk=document.createElement('canvas');dk.width=W;dk.height=H;const dx=dk.getContext('2d');
function drawDark(){
  if(!C.cave)return;
  dx.globalCompositeOperation='source-over';dx.clearRect(0,0,W,H);dx.fillStyle='rgba(0,0,0,.965)';dx.fillRect(0,0,W,H);
  dx.globalCompositeOperation='destination-out';
  const hole=(x,y,r,a)=>{const g=dx.createRadialGradient(x,y,r*.15,x,y,r);g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(1,'rgba(0,0,0,0)');dx.fillStyle=g;dx.fillRect(x-r,y-r,2*r,2*r)};
  hole(s.x,sy(s.y),[75,170,240,320][U.lamp],1);
  hole(CX,sy(0),140,.9);
  for(const d of docks){const[x0,x1]=dockRect(d);hole((x0+x1)/2,sy(d.m*PX),110,.9)}
  for(const l of w.lasers)if(l.on||l.warn)hole(CX,sy(l.m*PX),200,.8);
  ctx.drawImage(dk,0,0)
}
function overlay(t1,t2,t3='Pulsa R o Enter para reintentar'){
  ctx.fillStyle='#1a0a14dd';ctx.fillRect(0,H/2-90,W,160);
  ctx.textAlign='center';ctx.fillStyle='#ff7a3d';ctx.font='bold 30px Verdana';ctx.fillText(t1,CX,H/2-35);
  ctx.fillStyle='#ffd9a8';ctx.font='15px Verdana';ctx.fillText(t2,CX,H/2);
  ctx.fillText(t3,CX,H/2+40);
}
function draw(){
  ctx.save();if(s.shake>0){ctx.translate((Math.random()-.5)*s.shake*20,(Math.random()-.5)*s.shake*20);s.shake-=.02}const tgt=Math.max(0,s.y-300);s.cam+=(tgt-s.cam)*.12;
  drawSky();drawWalls();drawStation();drawDocks();drawRim();drawObs();drawShip();
  s.parts.forEach(p=>{ctx.fillStyle=Math.random()<.5?'#ff9a2a':'#ffd9a8';ctx.fillRect(p.x,sy(p.y),4,4)});
  drawDark();ctx.restore();drawHUD();shopSync();
  if(s.state==='crashed')overlay('Nave destruida',s.reason+' · '+(s.maxAlt|0)+' m (récord '+best.alt+' m)');
  if(s.state==='won')overlay('¡Completaste los 10 niveles!','Tiempo '+s.t.toFixed(0)+' s · récord '+best.time.toFixed(0)+' s');
  if(s.state==='menu')overlay('SALIDA DEL CRÁTER','Nivel '+lvl+' · '+C.name+' · $'+money,'Enter/toca: empezar · ◀ ▶ elige nivel');
  if(s.state==='levelup')overlay('¡Nivel '+(lvl-1)+' completado!','Siguiente: '+LC(lvl).name,'Toca o pulsa Enter para continuar');
  if(s.state==='paused')overlay('PAUSA','P o Esc para seguir','');
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
