:root{--bg:#1a0a14;--ink:#ffd9a8;--acc:#ff7a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:none;overscroll-behavior:none;margin:0;background:var(--bg);color:var(--ink);font-family:Silkscreen,"Trebuchet MS",monospace;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;height:100%;aspect-ratio:480/720;max-width:100%}
canvas{touch-action:none;width:100%;height:100%;display:block;background:#2a0f1e;image-rendering:pixelated}

#touch button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #ff7a3d99;background:#2a0f1ecc;color:var(--ink);font-size:26px;touch-action:none}
#touch .mid{width:84px;height:84px;background:#ff7a3d55}
#touch div{display:flex;gap:10px;align-items:flex-end}
#shop{position:absolute;top:8px;right:8px;width:200px;background:#1a0a14ee;border:1px solid #ff7a3d88;padding:8px;display:none;font-size:12px}
#shop b{display:block;margin-bottom:4px}
#shop button{display:block;width:100%;margin:4px 0;padding:6px;background:#3a1520;color:#ffd9a8;border:1px solid #ff7a3d66;text-align:left;font:inherit;cursor:pointer}
#shop button:disabled{opacity:.45;cursor:default}
#joy{width:120px;height:120px;border-radius:50%;border:2px solid #ff7a3d99;background:#2a0f1ecc;pointer-events:auto;touch-action:none;position:relative}

  if(C.moon){ctx.fillStyle='#2f6fc4';ctx.beginPath();ctx.arc(330,260+o,70,0,6.3);ctx.fill();ctx.fillStyle='#3f9a5a';ctx.fillRect(300,240+o,26,16);ctx.fillRect(345,275+o,22,12);ctx.fillStyle='#ffffffaa';ctx.fillRect(315,225+o,40,5)}else if(!C.cave){ctx.fillStyle='#f3d3a0';ctx.beginPath();ctx.arc(300,300+o,170,0,6.3);ctx.fill();
  ctx.strokeStyle='#e0a070';ctx.lineWidth=14;ctx.beginPath();ctx.arc(300,300+o,185,3.4,5.6);ctx.stroke();
  moons.forEach(([x,y,r,c])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y+o*1.5,r,0,6.3);ctx.fill()})}
}
function drawWalls(){
  const lo=s.cam-190,hi=s.cam+700;
  const T=theme(),layers=[[46,T.lay[0]],[22,T.lay[1]],[0,T.lay[2]]];
  for(const[off,col]of layers){
    for(const side of[-1,1]){
      ctx.fillStyle=col;ctx.beginPath();
      const ex=side<0?-20:W+20;
      ctx.moveTo(ex,sy(lo));
      for(let wy=lo;wy<=hi;wy+=10){const e=hw(wy/PX)+off;ctx.lineTo(CX+side*e,sy(wy))}
      ctx.lineTo(ex,sy(hi));ctx.closePath();ctx.fill();
    }
  }
  ctx.strokeStyle=T.edge;ctx.lineWidth=3;
  for(const side of[-1,1]){ctx.beginPath();for(let wy=lo;wy<=hi;wy+=10){const e=hw(wy/PX);const x=CX+side*e,y=sy(wy);wy===lo?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
}
function drawStation(){
  const y0=sy(0);
  ctx.fillStyle=theme().gr;ctx.fillRect(0,y0,W,H);
  ctx.fillStyle=theme().gs;ctx.fillRect(0,y0,W,6);
  // módulo colonia
  ctx.fillStyle='#5b1c2a';ctx.fillRect(40,y0-80,10,80);ctx.fillRect(150,y0-80,10,80);
  ctx.fillStyle='#d9663a';ctx.beginPath();ctx.moveTo(24,y0-100);ctx.lineTo(60,y0-122);ctx.lineTo(150,y0-122);ctx.lineTo(186,y0-100);ctx.lineTo(150,y0-78);ctx.lineTo(60,y0-78);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7a2230';ctx.fillRect(70,y0-112,70,12);
  ctx.fillStyle='#ffd9a8';for(let i=0;i<5;i++)ctx.fillRect(76+i*13,y0-109,8,6);
  ctx.fillStyle='#e8a070';ctx.fillRect(98,y0-160,6,40);ctx.fillRect(112,y0-148,6,28);
  ctx.fillStyle=(s.t*2|0)%2?'#ff4040':'#702020';ctx.fillRect(97,y0-166,8,6);
  // plataforma de despegue
  ctx.fillStyle='#3a1520';ctx.fillRect(CX-40,y0-3,80,6);
  ctx.fillStyle='#ffcf5a';ctx.fillRect(CX-40,y0-3,8,3);ctx.fillRect(CX+32,y0-3,8,3);
  ctx.fillStyle='#ffd9a8';ctx.font='9px Silkscreen,Verdana';ctx.textAlign='center';ctx.fillText('ESTACIÓN',CX,y0+22);
}
function drawDocks(){
  for(const d of docks){
    const top=sy(d.m*PX),[x0,x1]=dockRect(d);
    if(top<-40||top>H+40)continue;
    const wallX=d.side<0?x0-30:x1;
    ctx.fillStyle='#4a1a28';ctx.fillRect(wallX,top,30,16);
    ctx.fillStyle='#e8a070';ctx.fillRect(x0,top,x1-x0,6);
    ctx.fillStyle='#7a2230';ctx.fillRect(x0,top+6,x1-x0,8);
    const on=(s.t*2|0)%2;
    ctx.fillStyle=on?'#ffcf5a':'#8a5a2a';ctx.fillRect(x0+2,top-3,6,3);ctx.fillRect(x1-8,top-3,6,3);
    // surtidor
    const px=d.side<0?x0+12:x1-24;
    ctx.fillStyle='#4ad0a0';ctx.fillRect(px,top-26,12,26);ctx.fillStyle='#103a30';ctx.fillRect(px+2,top-22,8,8);
    ctx.fillStyle='#ffd9a8';ctx.font='bold 9px Silkscreen,Verdana';ctx.textAlign='center';
    ctx.fillText(d.f?'ASTILLERO':'PUERTO '+d.n+' · '+d.m+' m'+(d.n%3?'':' · -20%'),(x0+x1)/2+(d.side<0?8:-8),top+28);
  }
}
function drawRim(){
  const y=sy(RIM*PX);if(y<-60||y>H+60)return;
  ctx.fillStyle='#ffd9a8';ctx.font='bold 11px Silkscreen,Verdana';ctx.textAlign='center';
  ctx.fillText('BORDE DEL CRÁTER · '+RIM+' m',CX,y-8);
  ctx.strokeStyle='#ffd9a8';ctx.setLineDash([10,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.setLineDash([]);
}
function drawShip(){
  if(s.state==='crashed')return;
  const x=s.x,y=sy(s.y);
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.max(-.3,Math.min(.3,s.vx*.002)));
  if(s.th>.05&&s.fuel>0){
    const L=10+s.th*26*(.7+Math.random()*.5);
    for(const dx of[-8,8]){
      ctx.fillStyle='#ff9a2a';ctx.fillRect(dx-3,HH-6,6,L);
      ctx.fillStyle='#fff3b0';ctx.fillRect(dx-1,HH-6,2,L*.55);
    }
  }
  const e=demo?ds:eq,I=SH[e].im,h=HH*2*(e?1.15:1),w=h*I.width/(I.height||1);
  if(I.complete&&I.width)ctx.drawImage(I,-w/2,-h/2,w,h);
  else{ctx.fillStyle='#778';ctx.fillRect(-HW,-HH,HW*2,h)}
  ctx.restore();
}
function drawHUD(){
  const alt=Math.max(0,Math.round((s.y-HH)/PX*10)/10);
  ctx.fillStyle='#1a0a14cc';ctx.fillRect(8,8,170,132);
  ctx.textAlign='left';ctx.fillStyle='#ffd9a8';ctx.font='bold 12px Silkscreen,Verdana';
  ctx.fillText('Altura '+alt.toFixed(1)+' m',18,30);
  ctx.font='9px Silkscreen,Verdana';ctx.fillText('Velocidad '+Math.round(-s.vy/PX*10)/10+' m/s',18,48);
  const nd=docks.find(d=>d.m*PX>s.y-HH+4);
  ctx.fillText(sp?'Entra por el puerto inferior':nd?'Próximo puerto: '+(nd.m-alt).toFixed(0)+' m':'Siguiente: el borde ('+Math.max(0,RIM-alt).toFixed(0)+' m)',18,66);
  ctx.fillStyle='#3a1520';ctx.fillRect(18,74,150,10);
  const f=s.fuel/MAXF;ctx.fillStyle=f>.3?'#4ad0a0':'#ff4a3a';ctx.fillRect(18,74,150*f,10);
  ctx.fillStyle='#ffd9a8';ctx.font='8px Silkscreen,Verdana';ctx.fillText('COMBUSTIBLE',22,82);
  ctx.fillStyle='#ffd9a8';ctx.font='bold 10px Silkscreen,Verdana';ctx.fillText('$ '+money+'   Escudo '+s.shield+'/'+U.shield,18,110);ctx.font='9px Silkscreen,Verdana';ctx.fillText('Nivel '+lvl+' · '+C.name,18,130);if(demo){ctx.fillStyle='#ffcf5a';ctx.fillText('DEMO · '+SH[ds].n.toUpperCase(),18,152)}
  const bx=W-12;ctx.fillStyle='#1a0a14cc';ctx.fillRect(bx,100,6,300);for(const d of docks){ctx.fillStyle='#4ad0a0';ctx.fillRect(bx-3,400-d.m/RIM*300-1,12,2)}ctx.fillStyle='#ff7a3d';ctx.fillRect(bx-2,400-Math.min(1,alt/RIM)*300-3,10,6);
  if(s.msgT>0&&s.state==='play'){ctx.textAlign='center';ctx.font='bold 12px Silkscreen,Verdana';ctx.fillStyle='#1a0a14cc';const tw=ctx.measureText(s.msg).width+24;ctx.fillRect(CX-tw/2,H-190,tw,30);ctx.fillStyle='#ffd9a8';ctx.fillText(s.msg,CX,H-170)}
}
function hit(why){
  if(demo||s.inv>0)return;
  if(s.shield>0){s.shield--;s.inv=1.5;SND.hit();s.shake=.6;vib(60);say('¡Escudo dañado!',1.5);for(let i=0;i<14;i++)s.parts.push({x:s.x,y:s.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,l:.5})}
  else crash(why)
}
function breakBox(x){const g=Math.round((10+(Math.random()*15|0))*(1+.2*U.mag));money+=g;SND.box();SND.coin();if(x.t===1){s.fuel=Math.min(MAXF,s.fuel+30)}else if(x.t===2){s.shield=Math.min(U.shield+1,s.shield+1)}else if(x.t===3){boom(x.x,x.y,90,'Te alcanzó una explosión')}for(let i=0;i<10;i++){const a=Math.random()*6.28,v=30+Math.random()*90;s.parts.push({x:x.x,y:x.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6})}say('+$'+g,1)}
const wind=()=>C.wind&&s.y>900?Math.sin(s.t*.35+s.y/600)*70:0;
function boom(x,y,r,why){
  for(let i=0;i<(r?24:10);i++){const a=Math.random()*6.28,v=40+Math.random()*(r?200:100);s.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7})}
  if(!r)return;
  SND.crash();s.shake=.8;vib(100);
  for(const b of w.boxes)if(!b.dead&&Math.hypot(b.x-x,b.y-y)<r){b.dead=true;breakBox(b)}
  for(const e of[...w.turrets,...w.drones])if(!e.dead&&Math.hypot(e.x-x,e.y-y)<r){e.dead=true;money+=20;boom(e.x,e.y,0)}
  if(Math.hypot(s.x-x,s.y-y)<r*.8)hit(why)
}
function stepWorld(dt){
  s.cd-=dt;s.inv-=dt;if(s.fuel<20&&s.fuel>0&&(s.t*1.6|0)!==((s.t-dt)*1.6|0))tone(1000,.08,'square',.05);
  if(K.fire&&s.cd<=0){s.cd=CD*SHCD[demo?ds:eq];fire();SND.shoot();vib(8)}
  for(const b of w.boxes)if(!b.dead){b.x=b.x0+Math.sin(s.t*b.sp+b.ph)*35;b.y=b.y0+Math.cos(s.t*b.sp*.8+b.ph)*18}
  for(const q of w.saws)q.x=CX+Math.sin(s.t*q.sp+q.ph)*(hw(q.m)-26);
  for(const l of w.lasers){const on=((s.t+l.ph)%3)>1.7;if(on&&!l.on&&Math.abs(l.m*PX-s.y)<500)SND.laser();l.on=on;l.warn=((s.t+l.ph)%3)>1.1}
  const en=[...w.turrets,...w.drones];
  for(const t of w.turrets){t.x=CX+t.side*(hw(t.m)-8);t.y=t.m*PX;t.cd-=dt;if(!t.dead&&Math.abs(t.y-s.y)<380&&t.cd<=0){t.cd=2.2;const a=Math.atan2(s.y-t.y,s.x-t.x);s.eb.push({x:t.x,y:t.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,life:4})}}
  for(const d of w.drones)if(!d.dead&&Math.abs(d.y-s.y)<420){const a=Math.atan2(s.y-d.y,s.x-d.x),e=hw(d.y/PX);d.x=Math.max(CX-e+16,Math.min(CX+e-16,d.x+Math.cos(a)*60*dt));d.y+=Math.sin(a)*60*dt}
  for(const b of s.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(Math.abs(b.x-CX)>hw(b.y/PX))b.life=0;if(Math.abs(b.x-s.x)<HW+3&&Math.abs(b.y-s.y)<HH+3){b.life=0;hit('Te alcanzó un disparo')}}
  s.eb=s.eb.filter(b=>b.life>0);
  for(const b of s.bul){b.y+=(b.vy||520)*dt;if(b.h){let t=null,m=400;for(const q of[...w.boxes,...en])if(!q.dead&&q.y>b.y&&q.y-b.y<m){m=q.y-b.y;t=q}if(t)b.vx=Math.max(-300,Math.min(300,b.vx+Math.max(-1,Math.min(1,(t.x-b.x)/25))*1200*dt))}b.x+=b.vx*dt;b.life-=dt;
    if(Math.abs(b.x-CX)>hw(b.y/PX))b.life=0;
    for(const q of w.saws)if(Math.abs(b.x-q.x)<18&&Math.abs(b.y-q.m*PX)<18)b.life=0;
    for(const x of w.boxes)if(!x.dead&&Math.abs(b.x-x.x)<16&&Math.abs(b.y-x.y)<16){x.dead=true;if(!b.pi)b.life=0;breakBox(x)}
    for(const e of en)if(!e.dead&&b.life>0&&Math.abs(b.x-e.x)<16&&Math.abs(b.y-e.y)<16){if(b.pi){b.hs=b.hs||new Set();if(b.hs.has(e))continue;b.hs.add(e)}else b.life=0;e.hp-=(b.d||1)+.5*U.dmg;SND.hit();if(e.hp<=0){e.dead=true;money+=Math.round((e.side?25:15)*(1+.2*U.mag));boom(e.x,e.y,0);say('+$',.8)}}}
  s.bul=s.bul.filter(b=>b.life>0);
}
function collide(){
  for(const b of w.boxes)if(!b.dead&&Math.abs(s.x-b.x)<HW+11&&Math.abs(s.y-b.y)<HH+8){b.dead=true;hit('Chocaste con una caja')}
  for(const q of w.saws)if(Math.abs(s.x-q.x)<HW+q.r-3&&Math.abs(s.y-q.m*PX)<HH+q.r-3)hit('La sierra te cortó');
  for(const l of w.lasers)if(l.on&&Math.abs(s.y-l.m*PX)<HH+3)hit('Te alcanzó el láser');
  for(const d of w.drones)if(!d.dead&&Math.abs(s.x-d.x)<HW+10&&Math.abs(s.y-d.y)<HH+8){d.dead=true;boom(d.x,d.y,0);hit('Te embistió un dron')}
}
function drawObs(){
  const lo=s.cam-80,hi=s.cam+H;
  for(const b of w.boxes){if(b.dead||b.y<lo||b.y>hi)continue;const y=sy(b.y);ctx.fillStyle=['#c98a3a','#3ac98a','#3a8ac9','#c9463a'][b.t];ctx.fillRect(b.x-11,y-11,22,22);ctx.strokeStyle='#5a3410';ctx.lineWidth=2;ctx.strokeRect(b.x-11,y-11,22,22);ctx.beginPath();ctx.moveTo(b.x-11,y-11);ctx.lineTo(b.x+11,y+11);ctx.moveTo(b.x+11,y-11);ctx.lineTo(b.x-11,y+11);ctx.stroke()}
  for(const q of w.saws){const wy=q.m*PX;if(wy<lo||wy>hi)continue;ctx.save();ctx.translate(q.x,sy(wy));ctx.rotate(s.t*8);ctx.fillStyle='#d8dbe8';ctx.beginPath();
    for(let i=0;i<16;i++){const a=i*Math.PI/8,r=i%2?q.r-5:q.r+3;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
    ctx.closePath();ctx.fill();ctx.fillStyle='#4a1a28';ctx.beginPath();ctx.arc(0,0,5,0,6.3);ctx.fill();ctx.restore()}
  for(const l of w.lasers){const wy=l.m*PX;if(wy<lo||wy>hi)continue;const y=sy(wy),e=hw(l.m);
    ctx.fillStyle='#8a8fa8';ctx.fillRect(CX-e,y-8,12,16);ctx.fillRect(CX+e-12,y-8,12,16);
    if(l.on){ctx.fillStyle='#ff3a3a';ctx.fillRect(CX-e+12,y-3,2*e-24,6);ctx.fillStyle='#fff';ctx.fillRect(CX-e+12,y-1,2*e-24,2)}
    else if(l.warn){ctx.fillStyle='#ff3a3a66';ctx.fillRect(CX-e+12,y-1,2*e-24,2)}}
  for(const t of w.turrets){if(t.dead||t.y<lo||t.y>hi)continue;const y=sy(t.y),a=Math.atan2(-(s.y-t.y),s.x-t.x);ctx.fillStyle='#8a8fa8';ctx.fillRect(t.x-10,y-10,20,20);ctx.strokeStyle='#d8dbe8';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(t.x,y);ctx.lineTo(t.x+Math.cos(a)*18,y+Math.sin(a)*18);ctx.stroke()}
  for(const d of w.drones){if(d.dead||d.y<lo||d.y>hi)continue;const y=sy(d.y);ctx.fillStyle='#d9463a';ctx.beginPath();ctx.arc(d.x,y,11,0,6.3);ctx.fill();ctx.fillStyle='#ffe38a';ctx.fillRect(d.x-5,y-2,10,4)}
  ctx.fillStyle='#ff6a3a';for(const b of s.eb)ctx.fillRect(b.x-3,sy(b.y)-3,6,6);
  const wd=wind();if(Math.abs(wd)>15){ctx.strokeStyle='#ffd9a855';ctx.lineWidth=1;for(let i=0;i<14;i++){const x=((i*97+s.t*wd*4)%W+W)%W,y=(i*131+s.t*15)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+wd*.6,y);ctx.stroke()}}
  for(const b of s.bul){ctx.fillStyle=b.h?'#ff6ad0':b.big?'#8ae0ff':'#ffe38a';const k=b.big?3:1;ctx.fillRect(b.x-1.5*k,sy(b.y)-6,3*k,12*k)}
  if(s.state==='play'&&(s.shield>0||s.inv>0)){ctx.strokeStyle=s.inv>0?'#fff':'#6ad0ff66';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,sy(s.y),HH+4,0,6.3);ctx.stroke()}
}
const dk=document.createElement('canvas');dk.width=W;dk.height=H;const dx=dk.getContext('2d');
function drawDark(){
  if(!C.cave)return;
  dx.globalCompositeOperation='source-over';dx.clearRect(0,0,W,H);dx.fillStyle='rgba(0,0,0,.965)';dx.fillRect(0,0,W,H);
  dx.globalCompositeOperation='destination-out';
  const hole=(x,y,r,a)=>{const g=dx.createRadialGradient(x,y,r*.15,x,y,r);g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(1,'rgba(0,0,0,0)');dx.fillStyle=g;dx.fillRect(x-r,y-r,2*r,2*r)};
  hole(s.x,sy(s.y),[75,170,240,320][U.lamp],1);
  hole(CX,sy(0),140,.9);
  for(const d of docks){const[x0,x1]=dockRect(d);hole((x0+x1)/2,sy(d.m*PX),110,.9)}
  for(const l of w.lasers)if(l.on||l.warn)hole(CX,sy(l.m*PX),200,.8);
  ctx.drawImage(dk,0,0)
}
function overlay(t1,t2,t3='Pulsa R o Enter para reintentar'){
  ctx.fillStyle='#1a0a14dd';ctx.fillRect(0,H/2-90,W,160);
  ctx.textAlign='center';ctx.fillStyle='#ff7a3d';ctx.font='bold 23px Silkscreen,Verdana';ctx.fillText(t1,CX,H/2-35);
  ctx.fillStyle='#ffd9a8';ctx.font='12px Silkscreen,Verdana';ctx.fillText(t2,CX,H/2);
  ctx.fillText(t3,CX,H/2+40);
}
function draw(){
  if(s.state==='inside'){drawIn();menuSync();return}
  ctx.save();if(s.shake>0){ctx.translate((Math.random()-.5)*s.shake*20,(Math.random()-.5)*s.shake*20);s.shake-=.02}const tgt=Math.max(0,s.y-300);s.cam+=(tgt-s.cam)*.12;if(sp){ctx.translate(CX,504);ctx.scale(.5,.5);ctx.translate(-CX,-504)}
  if(sp)drawSpace();else{drawSky();drawWalls();drawStation();drawDocks();drawRim()}drawObs();drawShip();
  s.parts.forEach(p=>{ctx.fillStyle=Math.random()<.5?'#ff9a2a':'#ffd9a8';ctx.fillRect(p.x,sy(p.y),4,4)});
  drawDark();ctx.restore();drawHUD();menuSync();shopSync();
  if(s.state==='crashed')overlay('Nave destruida',s.reason+' · '+(s.maxAlt|0)+' m (récord '+best.alt+' m)');
  if(s.state==='won')overlay('¡Completaste los 10 niveles!','Tiempo '+s.t.toFixed(0)+' s · récord '+best.time.toFixed(0)+' s');
  if(s.state==='levelup')overlay('¡Nivel '+(lvl-1)+' completado!','Siguiente: '+LC(lvl).name,'Toca o pulsa Enter para continuar');
  if(s.state==='paused')overlay('PAUSA','P o Esc para seguir','');
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
